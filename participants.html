<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>Boo Basket Participants</title>

  <style>
    :root {
      --cream: #fbf4e7;
      --paper: #fffaf2;
      --brown: #513422;
      --orange: #dd6b28;
      --sage: #788266;
      --muted: #7b6a5d;
      --line: #ead8c3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px 40px;

      color: var(--brown);

      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(232,173,53,.18),
          transparent 18rem
        ),
        var(--cream);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .wrap {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;

      font-size: clamp(2rem, 9vw, 3rem);
    }

    .subtitle {
      margin: 8px 0 0;

      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 8px;
      margin: 20px 0;
    }

    .stat {
      padding: 14px 8px;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: var(--paper);

      text-align: center;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
    }

    .stat-label {
      margin-top: 3px;

      color: var(--muted);

      font-size: .68rem;
    }

    .participant-list {
      display: grid;
      gap: 10px;
    }

    .participant {
      padding: 15px;

      border: 1px solid var(--line);
      border-radius: 16px;

      background: rgba(255,250,242,.95);
    }

    .participant-name {
      margin-bottom: 10px;

      font-size: 1rem;
      font-weight: 800;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;

      gap: 7px;
    }

    .badge {
      display: inline-flex;
      align-items: center;

      padding: 6px 9px;

      border-radius: 999px;

      font-size: .75rem;
      font-weight: 700;
    }

    .eligible {
      color: #78411f;
      background: #f8e1cd;
    }

    .free {
      color: #5d5b4a;
      background: #eee9dd;
    }

    .stepup {
      color: #4f5a3f;
      background: #e5ead8;
    }

    .waiting {
      color: #7b6753;
      background: #f4eadc;
    }

    .loading,
    .error {
      padding: 24px;

      color: var(--muted);

      text-align: center;
    }
  </style>
</head>

<body>
  <main class="wrap">

    <header>
      <h1>Challenge Participants 🎃</h1>

      <p class="subtitle">
        See who's in the Boo Basket Step Challenge.
      </p>
    </header>

    <section class="stats">

      <div class="stat">
        <div
          class="stat-value"
          id="total-count"
        >
          —
        </div>

        <div class="stat-label">
          Participants
        </div>
      </div>

      <div class="stat">
        <div
          class="stat-value"
          id="paid-count"
        >
          —
        </div>

        <div class="stat-label">
          Prize Eligible
        </div>
      </div>

      <div class="stat">
        <div class="stat-value">
          $<span id="prize-fund">—</span>
        </div>

        <div class="stat-label">
          Boo Basket Fund
        </div>
      </div>

    </section>

    <section
      id="participant-list"
      class="participant-list"
    >
      <div class="loading">
        Loading participants…
      </div>
    </section>

  </main>

  <script>
    const STATS_URL = "https://script.google.com/macros/s/AKfycbx14iDiw-Kv39LmtBysCxzETltAWW_aMMNT94M1nyN4E6VPOi_oHrUsqQ6JXBovuTQU8g/exec";

    async function loadParticipants() {
      const list = document.getElementById("participant-list");

      try {
        const response = await fetch(STATS_URL);

        if (!response.ok) {
          throw new Error("Unable to load participant data");
        }

        const data = await response.json();

        document.getElementById(
          "total-count"
        ).textContent =
          data.totalParticipants;

        document.getElementById(
          "paid-count"
        ).textContent =
          data.paidParticipants;

        document.getElementById(
          "prize-fund"
        ).textContent =
          data.prizeFund;

        list.innerHTML = "";

        data.participants.forEach(
          participant => {

            const card =
              document.createElement(
                "article"
              );

            card.className =
              "participant";

            const eligibility =
              participant.eligible
                ? `
                  <span class="badge eligible">
                    🎃 Boo Basket Eligible
                  </span>
                `
                : `
                  <span class="badge free">
                    NOT ELIGIBLE TO WIN
                  </span>
                `;

            const stepUp =
              participant.inStepUp
                ? `
                  <span class="badge stepup">
                    ✓ In StepUp
                  </span>
                `
                : `
                  <span class="badge waiting">
                    Waiting to Join StepUp
                  </span>
                `;

            card.innerHTML = `
              <div class="participant-name">
                ${escapeHtml(
                  participant.name
                )}
              </div>

              <div class="badges">
                ${eligibility}
                ${stepUp}
              </div>
            `;

            list.appendChild(card);
          }
        );

      } catch (error) {
        console.error(error);

        list.innerHTML = `
          <div class="error">
            Unable to load participants
            right now.
          </div>
        `;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    loadParticipants();
  </script>
</body>
</html>
